<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101b2b">
  <meta name="description" content="911: Idle Dispatch oyununu App Store veya Google Play'den indir.">
  <title>911: Idle Dispatch | İndir</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; margin: 0; padding: 24px; color: #f5f8fc; background: radial-gradient(circle at top, #233d59 0, #101b2b 54%, #0a111c 100%); }
    main { width: min(100%, 440px); padding: 34px 28px; text-align: center; background: #142338; border: 1px solid #39506c; border-radius: 24px; box-shadow: 0 24px 70px #0006; }
    .symbol { display: grid; place-items: center; width: 66px; height: 66px; margin: 0 auto 22px; border-radius: 18px; background: #d5364b; color: white; font-weight: 900; font-size: 29px; letter-spacing: -.06em; }
    h1 { margin: 0; font-size: clamp(26px, 7vw, 36px); line-height: 1.1; }
    .subtitle { margin: 12px 0 28px; color: #c1cede; line-height: 1.5; }
    .store { display: flex; align-items: center; justify-content: space-between; width: 100%; margin-top: 12px; padding: 17px 20px; border: 1px solid #5a7595; border-radius: 14px; color: #fff; background: #203653; text-decoration: none; font-size: 17px; font-weight: 700; transition: background .2s, transform .2s; }
    .store:hover, .store:focus-visible { background: #2b486d; transform: translateY(-2px); }
    .store:focus-visible { outline: 3px solid #80c9ff; outline-offset: 3px; }
    .arrow { font-size: 21px; line-height: 1; }
    #status { min-height: 44px; margin: 22px 0 0; color: #afc1d5; font-size: 14px; line-height: 1.5; }
  </style>
</head>
<body>
  <main>
    <div class="symbol" aria-hidden="true">911</div>
    <h1>911: Idle Dispatch</h1>
    <p class="subtitle">Acil çağrıları yönet. Ekibini doğru yere, doğru zamanda gönder.</p>

    <a id="ios-link" class="store" href="https://apps.apple.com/tr/app/911-idle-dispatch/id6813881867?l=tr">
      <span>App Store'dan indir</span><span class="arrow" aria-hidden="true">↗</span>
    </a>
    <a id="android-link" class="store" href="https://play.google.com/store/apps/details?id=com.hantro.wwiii&amp;hl=tr">
      <span>Google Play'den indir</span><span class="arrow" aria-hidden="true">↗</span>
    </a>

    <p id="status" role="status" aria-live="polite">Cihazın algılanıyor…</p>
  </main>

  <script>
    const GA4_ID = 'G-W6SN1JY1H2';
    const IOS_URL = document.getElementById('ios-link').href;
    const ANDROID_URL = document.getElementById('android-link').href;
    const status = document.getElementById('status');
    const analyticsReady = /^G-[A-Z0-9]+$/.test(GA4_ID);

    if (analyticsReady) {
      window.dataLayer = window.dataLayer || [];
      window.gtag = function () { window.dataLayer.push(arguments); };
      window.gtag('js', new Date());
      window.gtag('config', GA4_ID); // page_view: bağlantı sayfasının görüntülenmesi

      const tag = document.createElement('script');
      tag.async = true;
      tag.src = 'https://www.googletagmanager.com/gtag/js?id=' + encodeURIComponent(GA4_ID);
      document.head.appendChild(tag);
    }

    let redirectStarted = false;

    window.addEventListener('pageshow', function (event) {
      if (event.persisted) {
        redirectStarted = false;
        status.textContent = 'Mağazanı seçerek tekrar açabilirsin.';
      }
    });

    function goToStore(platform, method) {
      if (redirectStarted) return;
      redirectStarted = true;

      const url = platform === 'ios' ? IOS_URL : ANDROID_URL;
      const eventName = platform === 'ios' ? 'app_store_redirect' : 'google_play_redirect';
      status.textContent = platform === 'ios' ? "App Store'a yönlendiriliyorsun…" : "Google Play'e yönlendiriliyorsun…";

      let navigated = false;
      function navigate() {
        if (navigated) return;
        navigated = true;
        if (method === 'automatic') window.location.replace(url);
        else window.location.assign(url);
      }

      if (analyticsReady) {
        // Olay işlenince ilerle; etiket engellenirse yedek süre sonunda yine ilerle.
        window.setTimeout(navigate, 1800);
        window.gtag('event', eventName, {
          method: method,
          event_callback: navigate,
          event_timeout: 1500
        });
      } else {
        navigate();
      }
    }

    document.getElementById('ios-link').addEventListener('click', function (event) {
      if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey || event.button !== 0) return;
      event.preventDefault();
      goToStore('ios', 'manual');
    });

    document.getElementById('android-link').addEventListener('click', function (event) {
      if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey || event.button !== 0) return;
      event.preventDefault();
      goToStore('android', 'manual');
    });

    const ua = navigator.userAgent || '';
    const isAndroid = /Android/i.test(ua);
    const isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

    if (!analyticsReady) {
      status.textContent = 'Ölçüm kimliği henüz eklenmedi. Mağaza bağlantılarını elle açabilirsin.';
    } else if (isAndroid || isIOS) {
      window.setTimeout(function () { goToStore(isAndroid ? 'android' : 'ios', 'automatic'); }, 350);
    } else {
      status.textContent = 'Bilgisayardaysan mağazanı seç. Telefonda uygun mağazaya otomatik yönlendirilirsin.';
    }
  </script>
</body>
</html>
